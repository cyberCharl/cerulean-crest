        - generic [ref=e566]:
          - paragraph [ref=e568]: Description of the key performance indicators (KPIs)
          - table [ref=e569]:
            - rowgroup [ref=e570]:
              - row [ref=e571]:
                - columnheader "KPI" [ref=e572]
                - columnheader "Mass balance description" [ref=e573]
            - rowgroup [ref=e574]:
              - row [ref=e575]:
                - cell "WUE" [ref=e576]
                - 'cell "$1 - \\frac{\\sum\\limits_{k}\\left( {F_{dis,k}^{RAS} + F_{dis,k}^{HPS}} \\right)}{\\sum_{k = 1}^{N}F_{clean\\ water,k}^{total,in}}$" [ref=e577]'
              - row [ref=e578]:
                - cell "NUE" [ref=e579]
                - 'cell "$1 - \\frac{\\sum\\limits_{k = 1}\\left( {F_{dis,k}^{RAS} \\cdot C_{N_{soluble},k}^{RAS} + F_{dis,k}^{HPS} \\cdot C_{N_{soluble},k}^{HPS} + {M_{N}}_{digestate,k}} \\right)}{\\sum\\limits_{k = 1}\\left( {M_{N_{feed},k} + M_{N_{fert},k} + M_{N_{\\ manure},k}} \\right)}$" [ref=e580]'
              - row [ref=e581]:
                - cell "PUE" [ref=e582]
                - 'cell "$1 - \\frac{\\sum\\limits_{k = 1}\\left( {F_{dis,k}^{RAS} \\cdot C_{P_{soluble}}^{RAS} + F_{dis,k}^{HPS} \\cdot C_{P_{soluble}}^{HPS} + {M_{P}}_{digestate,k}} \\right)}{\\sum\\limits_{k = 1}\\left( {M_{P_{feed},k} + M_{P_{fert},k} + M_{P_{\\ manure},k}} \\right)}$" [ref=e583]'
              - row [ref=e584]:
                - cell "NSS" [ref=e585]
                - 'cell "$\\frac{\\sum\\limits_{k = 1}{\\left( {M_{N,k}^{RAS\\rightarrow HPS} + M_{N,k}^{AD_{1}\\rightarrow HPS} + M_{N,k}^{AD_{2}\\rightarrow HPS}} \\right)\\ }}{\\sum\\limits_{k = 1}\\left( {M_{N,k}^{RAS\\rightarrow HPS} + M_{N,k}^{AD_{1}\\rightarrow HPS} + M_{N,k}^{AD_{2}\\rightarrow HPS} + M}_{N_{fert},k} \\right)}$" [ref=e586]'
              - row [ref=e587]:
                - cell "PSS" [ref=e588]
                - 'cell "$\\frac{\\sum\\limits_{k = 1}{\\left( {M_{P,k}^{RAS\\rightarrow HPS} + M_{P,k}^{AD_{1}\\rightarrow HPS} + M_{P,k}^{AD_{2}\\rightarrow HPS}} \\right)\\ }}{\\sum\\limits_{k = 1}\\left( {M_{P,k}^{RAS\\rightarrow HPS} + M_{P,k}^{AD_{1}\\rightarrow HPS} + M_{P,k}^{AD_{2}\\rightarrow HPS} + M}_{P_{fert},k} \\right)}$" [ref=e589]'
          - paragraph [ref=e590]: KPIs allow to quantify water discharge requirements (WUE), squandering of nitrogen (NUE) and phosphorus (PUE) relative to total inputs. The numerator of the use-efficiency KPIs are losses and denominator are inputs. The amount of synthetic fertilizer relative to total inputs used in the hydroponic production system is measured using the nutrient self-sufficiency for nitrogen (NSS) and phosphorus (PSS). The numerator of the self-sufficiency is expressed as the nutrients originating from within the network over the total inputs.
        - paragraph [ref=e591]: DAP networks were optimized by selecting the hydroponic area and control trajectories under the constraint that only dissolved nutrients are available to the crop. Across all three locations, the optimizer converged to the same operating principle since the hydroponic greenhouse was sized such that nitrogen could be maintained close to the lower hydroponic N boundary. This limits dissolved-nitrogen losses and avoids water discharge from the aquaculture-hydroponic loop, but pushes P demand, which requires substantial supplementation (PSS = 8%).
        - paragraph [ref=e592]:
          - text: Integrating anaerobic digestion within a RAS-HPS network enables recovery and reuse of nutrients contained in fish sludge and plant residues, alleviating phosphorus limitation and improving overall resource retention. Compared with DAP, wasted N decreased by 32% in Jakarta (157–107 gN m
          - superscript [ref=e593]: −2
          - text: ), 47% in Cairo (154–81 gN m
          - superscript [ref=e594]: −2
          - text: ), and 59% in Amsterdam (127–53 gN m
          - superscript [ref=e595]: −2
          - text: ), while wasted P decreased by 46% (46–25 gP m
          - superscript [ref=e596]: −2
          - text: ), 18% (46–38 gP m
          - superscript [ref=e597]: −2
          - text: ), and 40% (37–22 gP m
          - superscript [ref=e598]: −2
          - text: ), respectively. Consequently, the Jakarta base and extended configurations in Cairo and Amsterdam achieved full phosphorus self-sufficiency (PSS = 100%) without synthetic P additions, whereas DAP required 18–30 gP m
