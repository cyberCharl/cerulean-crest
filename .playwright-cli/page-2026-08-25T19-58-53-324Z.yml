      - paragraph [ref=e623]:
        - text: Taken together, these reductions indicate that recovering nutrients from particulate waste streams, either internally generated (fish sludge and plant residues) or imported as a co-substrate, can substantially improve circular performance relative to decoupled aquaponics. The resource-efficiency gains identified in this study point to a larger global opportunity. A substantial share (often more than half for some species) of the N and P supplied in feed ultimately ends up in residual waste streams, across an estimated ∼58 million tons of fish feed used annually. Since aquaculture production is concentrated in many regions of the Global South (∼95% of global output), approaches that reduce reliance on virgin fertilizers by improving internal reuse may also strengthen resilience to input price volatility and help to improve food security. Beyond waste mitigation, fish-feed production itself poses environmental and economic challenges due to reliance on fishmeal and soybean meal. Within the network, valorizing the anaerobic digestate, the main remaining waste stream in our model, could further strengthen circularity. Options include conversion to insects (e.g., black soldier fly larvae), algae, or duckweed to recycle nutrients into feed, CO
        - subscript [ref=e624]: "2"
        - text: capture from biogas use for greenhouse enrichment, or bioplastic pathways from fish scales and plant residues. Such cascading use may be facilitated in eco-industrial food parks where firms co-locate and exchange by-products. Despite the pressing need, economic hurdles still hinder adoption of on-site waste-upcycling technologies. For example, it was found that large-scale anaerobic digestion of mixed farm residues in the Netherlands was unprofitable without subsidies, mainly due to transport costs and application limits that restricted fertilizer sales. In the integrated network proposed here, internal reuse can reduce disposal and fertilizer costs, but investment and operating costs remain non-trivial and profitability will likely depend on scale and logistics. However, looking forward, the economic tables might turn as resource scarcity and environmental policy instruments (e.g., carbon pricing or nutrient-emission regulation) could raise the cost of virgin fertilizers and feeds used in the aquaculture/livestock sector and incentivize circular resource recovery, potentially turning on-site anaerobic digestion from a cost burden into a competitive advantage.
      - generic [ref=e625]:
        - heading "Limitations of the study" [level=4] [ref=e626]
        - paragraph [ref=e627]: It should be emphasized that this study is exploratory and primarily methodological. The main insights do not depend on precise parameter values, but on structural constraints, the admissible decision variables, and the optimization framework itself. Full validation at integrated-network scale remains challenging because large-scale coupled systems of the type modeled here are not yet widely available. Consequently, we rely on modular validation against literature-reported ranges for subsystem performance. Future pilot data would enable integrated validation and parameter identification, supporting site-specific engineering design and stronger uncertainty quantification.
        - paragraph [ref=e628]: Several modeling simplifications may nonetheless influence the quantitative optima. The anaerobic digesters are represented using zeroth-order mineralization kinetics rather than ADM1-level biochemical detail, thereby omitting intermediate metabolite dynamics, microbial community effects, and pathway-specific inhibition. As a result, the model cannot fully resolve the fate and form of phosphorus and nitrogen during digestion, and may misrepresent the timing and extent of nutrient release under co-digestion, as well as the scope for optimizing reactor operation with respect to inhibition risk (e.g., ammonia, volatile fatty acids [VFAs]), crop-specific VFA tolerance, and plant-available nutrient recovery. Similarly, the radiation- and evapotranspiration-driven crop model tends to overpredict lettuce yields by 10%–20% under high-radiation conditions, which could affect optimal system sizing. The sensitivity assessment is also scenario-based (±20% perturbations) rather than probabilistic, as parameter distributions for integrated operation are not yet available.
        - paragraph [ref=e629]: More broadly, the mass-balance KPIs do not capture greenhouse-gas emissions, logistics, storage losses, or residual organics in digestate. Life cycle and techno-economic assessment will be needed to translate resource-efficiency gains into net sustainability benefits. In addition, the loop-closing strategy presupposes controllable and capturable waste streams and is therefore most applicable to intensive or semi-closed production systems, whereas most global aquaculture still relies on ponds and open-water cages.
