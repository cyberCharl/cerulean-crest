    - paragraph [ref=e52]: 10 min · decision framework / career strategy
    - paragraph [ref=e53]: Editor’s margin. Keep the experimental method—test career hypotheses through progressively costlier contact with reality—without needing to adopt the organisation's wider moral framework.
    - paragraph [ref=e55]: Career fit is hard to predict from introspection alone. Treat it as a sequence of hypotheses that earn progressively more expensive tests.
    - paragraph [ref=e56]: "Begin with provisional rankings. Then list the uncertainties that would actually change the ordering: day-to-day enjoyment, rate of skill growth, realistic entry chances, fit with personal constraints, or performance relative to peers. Resolve the most decision-relevant uncertainty with the cheapest available contact with reality."
