      - generic [ref=e167]:
        - heading "Integrated anaerobic digestion outperforms optimized decoupled aquaponics" [level=4] [ref=e168]
        - paragraph [ref=e169]: We evaluated each optimized network using water, nitrogen, and phosphorus use efficiencies (WUE, NUE, and PUE), defined as one minus the ratio of annual losses to annual inputs. We additionally report nitrogen and PSS (NSS, PSS), indicating the fraction of hydroponic nutrient demand met from internal sources (fish and plant waste, and manure optionally). For WUE, the wasted water stream excludes water contained in unutilized wet-solid material waste streams (digestate, sludge, and plant waste), which is reported separately, because it represents only a small fraction of total water inputs. Table 1 compares the indicators and associated resource flows with optimized decoupled aquaponics (DAP) reference network without anaerobic digestion under identical climate conditions. The decision variables and constraints underlying these optimizations are summarized in Table 2, and the KPI definitions used to calculate the indicators in Table 1 are provided in Table 3. DAP nutrient and fertilizer supplementation profiles are shown in Figures S5–S7.
