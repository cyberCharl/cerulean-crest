        - paragraph [ref=e129]: Hydroponic volume only decreased in response to transpiration. Transpiration losses were offset by steady digester effluents, supplemented by aquaculture water and clean water to satisfy volume constraints (Figure 3A). Variations in fish-sludge inflow reflected the staggered fish production strategy, while the addition of water ensured constant reactor volumes during periods of low fish sludge production (Figure 3B). In the digester handling inedible lettuce residues, clean water was likewise added to keep the reactor volume constant as lettuce-waste production fluctuated due to weather conditions and changes in hydroponic nutrient concentrations (Figure 3C). Despite variation in fish feed and lettuce waste supply, digester feed concentrations and volatile-solids loading rates in both reactors remained within, or close to, the prescribed feasibility bounds throughout the year.
      - generic [ref=e130]:
        - heading "Seasonality narrows the feasible operating window and increases sensitivity" [level=4] [ref=e131]
        - paragraph [ref=e132]:
          - text: Compared to Cairo and Amsterdam (results shown in Figures S1 and S2), Jakarta represents the most favorable case, where relatively constant evapotranspiration keeps crop uptake easily aligned with the waste-derived nutrient supply. In more seasonal climates, the optimizer must instead navigate through alternating regimes where high-demand periods risk nutrient deficits and low-demand periods promote accumulation. In Cairo, the optimizer could still manage this trade-off without liquid discharge at an optimal HPS area of 1350 m
          - superscript [ref=e133]: "2"
          - text: ", maintaining full irrigation closure (WUE = 100%, NUE = 79%, PUE = 72%) and near-complete phosphorus self-sufficiency (PSS ≈ 99%). In Amsterdam, stronger seasonality increased the mismatch between demand and waste-derived supply, making periodic discharge and external inputs unavoidable at the optimal HPS area of 2700 m"
          - superscript [ref=e134]: "2"
          - text: and lowering WUE, NUE, PUE, and PSS to 93%, 75%, 70%, and 82%, respectively.
        - paragraph [ref=e135]: Together, the Cairo and Amsterdam optima indicate that as seasonal variability increases, the feasible operating window narrows and performance becomes more sensitive to biological and operational uncertainty. To quantify this sensitivity, we re-solved the optimal control problem under ±20% perturbations of key parameters (Figure 4). Under perturbations, feasibility is still enforced through the path and balance constraints, but maintaining those constraints may require additional discharge and/or external nutrient inputs. We therefore use WUE, NSS, and PSS as sensitivity indicators that measure how strongly closed-loop performance decreases under uncertainty.
