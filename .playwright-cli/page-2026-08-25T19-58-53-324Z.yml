        - paragraph [ref=e141]: Across all climates, the sensitivity patterns are dominated by evapotranspiration (ET) and feed conversion ratio (FCR), which shift crop nutrient demand and waste-derived nutrient loading. The largest WUE reductions under ±20% perturbations were 7.3% in Jakarta and Cairo (both driven by −20% ET) and 9.6% in Amsterdam (−20% ET). The largest PSS reductions were 8.2% in Jakarta (−20% FCR), 11.4% in Cairo (−20% FCR), and 5.4% in Amsterdam (+20% FCR). In contrast, excretion-partitioning parameters and most mineralization coefficients caused only minor KPI changes within ±20%. Among the digestion-related parameters, the largest effect was a 20% reduction in the AD1 P mineralization coefficient, which reduced PSS by 9.6% in Amsterdam, 8.6% in Cairo, and 6.3% in Jakarta. NSS remains robust in all cases, whereas the higher sensitivity in PSS confirms that P recoverability becomes the critical bottleneck under uncertainty.
        - paragraph [ref=e142]: Jakarta shows the weakest response, consistent with its stable ET regime. KPI reduction occurs mainly when ET decreases, which reduces crop uptake and triggers discharge (lower WUE), and when effective phosphorus recovery decreases (e.g., lower AD1 P mineralization or lower waste generation), which reduces PSS.
        - paragraph [ref=e143]: Cairo exhibits the same mechanisms as Jakarta but with a stronger PSS response. Reduced ET lowers crop demand, increasing the risk of accumulation and triggering discharge (WUE decreases), whereas increased ET exposes phosphorus limitation during peak demand, requiring external P inputs and reducing PSS. Taken together, this indicates that in two-season hot climates, peak-demand periods can amplify P limitation, particularly when biological P recovery is simultaneously reduced. Minor improvements in PSS are measured as well for positive perturbations that cause an increase in P supply.
        - paragraph [ref=e144]: Amsterdam is the most sensitive overall. Strong seasonality pushes the network into both oversupply (cold, low-ET periods) and undersupply (warm, high-ET periods), so ±20% perturbations can have comparable but opposite effects. In this regime, perturbations that increase net N loading (e.g., higher fish excretion, higher mineralization, or higher plant-waste availability) can worsen performance by accelerating nitrate accumulation, increasing the need for discharge and thereby reducing WUE (and, indirectly, PSS). Conversely, lower ET further increases accumulation pressure and reduces WUE, whereas higher ET raises crop demand and shifts the limiting factor toward phosphorus availability, reducing PSS. Overall, FCR and AD1 P mineralization remain the strongest drivers of PSS.
      - generic [ref=e145]:
        - heading "Manure co-digestion restores closed-loop feasibility and robustness in seasonal climates" [level=4] [ref=e146]
        - paragraph [ref=e147]: The results and sensitivity analysis from the base configurations indicate that closed-loop operation on internal waste streams is robust under tropical conditions, but becomes increasingly constrained as seasonality intensifies. While NSS remains stable across climates, PSS decreases under a wide range of parameter perturbations, especially in Amsterdam and, to a lesser extent, in Cairo, reflecting phosphorus limitation during high-demand periods and nitrogen accumulation beyond the target range during low-demand periods. We therefore evaluated an extended configuration in which manure is co-digested to provide an additional mineralizable nutrient source and increase operational flexibility. This extension was analyzed for Cairo and Amsterdam, where it is most relevant.
