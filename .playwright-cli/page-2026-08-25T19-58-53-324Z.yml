          - superscript [ref=e162]: "3"
          - text: for AD2 in Cairo and Amsterdam, respectively. Larger reactor volumes are required compared to the base-configuration to accommodate the additional manure flows that are needed to feed the oversized HPS area. For both locations, volatile solids (VS) loading rates and total solids (TS) levels were kept very close in range of the optimum. Finally, repeating the ±20% perturbation analysis for the manure-extended configurations showed that co-digestion completely dampened sensitivity. None of the perturbations caused changes in the KPIs (results not shown). The overall workflow used to obtain these base and manure-extended network configurations, including climate-data preprocessing, static sizing, dynamic optimization, and KPI evaluation, is summarized in Figure 7.
        - figure "Hydraulic flow profiles of the Cairo (ABC) and Amsterdam (DEF) case studies (A–D) Shows the amount of water the HPS receives from two anaerobic digesters, one co-digesting fish sludge with a manure mixture (AD1) and the other co-digesting plant waste with a manure mixture (AD2), an external fresh water source (CW), and the recirculating aquaculture system (AW). These flows align with the greenhouse evapotranspiration (ET) denoted by the black dashed line. (B–F) Show the incoming anaerobic digester flows from fish sludge (FS), plant waste (PW), chicken manure (CM), pig manure (PM). Reactor inflows are determined based on a predefined range of total solid and volatile solid loading rates." [ref=e163]:
