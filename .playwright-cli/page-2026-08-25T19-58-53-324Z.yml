    - generic [ref=e609]:
      - heading "Discussion" [level=3] [ref=e610]
      - paragraph [ref=e611]: "We treat an integrated recirculating aquaculture system (RAS) and hydroponic production system (HPS), coupled to anaerobic digestion, as a dynamic resource-allocation problem, in which time-varying, waste-derived nitrogen (N) and phosphorus (P) streams must be allocated to meet crop demand while maintaining fish- and crop water-quality constraints. By translating this coupled design-operation problem into a constrained optimal control problem, we position circular aqua-agriculture within the optimal control literature on constrained dynamic resource allocation. This connects our work to optimal-control studies in aquaculture, often focused on operational and economic decisions such as feeding regimes, stocking densities, harvesting, and system sizing and to agricultural optimal control, where applications range from minimizing actuator inputs while maximizing greenhouse climate conditions to efficient irrigation strategies. In the integrated setting, the aquaculture and hydroponic domains become coupled: operating policies that improve circularity (e.g., reduced discharge, higher nutrient reuse) can restrict feasible operating choices and change the best operating strategy, creating explicit trade-offs between resource conservation, operational robustness, and when economic objectives are included profitability."
      - paragraph [ref=e612]: The optimal-control problem that we have defined (Equations 1, 2, 3, 4, 5, 6, 7, and 8) is nonconvex, due to the nonlinear terms in the mass-balance equations where control flows are multiplied by time-varying concentration states. Therefore, the existence of a globally unique optimum cannot be analytically guaranteed. Instead, multiple local optima may exist due to nonlinearity and nonconvexity. The feasibility of the solution is ensured numerically by the fulfillment of the KKT conditions within the IPOPT solver. From a control-theoretic perspective, the feasibility of the “closed-loop” state is constrained by the controllability of the nutrient ratios. In the base configuration (digesters treating only fish sludge and plant residues), the lack of independent control over N and P mineralization can lead to two types of “trapped” states. The first type is a deficit which can only be solved via supplementation of synthetic fertilizer, while the second type involves oversaturation where discharge of nutrient-rich water becomes the only feasible action to prevent accumulation. The introduction of manure co-digestion in the extended configuration adds an independent control input, which allows adjustment of the N:P supply ratio and hence restores feasibility of discharge-free operation. Even when multiple local optima exist, the resulting trajectories are still physically consistent and align with the limits set by mass balances and operating constraints of the network.
      - paragraph [ref=e613]: Solving the optimal control problem separately for tropical, arid, and temperate climates shows that closed-loop operation in the base configuration is readily achievable under weak seasonality (Jakarta, Indonesia), becomes marginally P-limited under moderate seasonality (Cairo, Egypt), and requires discharge plus external synthetic fertilizers under strong seasonality due to N oversaturation and stronger P deficits (Amsterdam, the Netherlands). As seasonal variability increases, the network alternates more frequently between oversupply (cold, low-ET periods) and undersupply (warm, high-ET periods), making it harder to align waste-derived nutrient release with crop demand.
      - paragraph [ref=e614]: Differences between N and P biogeochemistry help explain why P-based indicators (e.g., PUE/PSS) are lower or more sensitive than N-based indicators as seasonality intensifies. N is largely (60%–90%) excreted by fish in dissolved form (TAN), which is readily available for plant uptake, while losses via nitrification-denitrification depend on oxygenation and process conditions. In contrast, P is predominantly retained in solids and must first be mineralized before becoming available to plants. Moreover, during organic-matter breakdown under near-neutral pH, released orthophosphate can be re-immobilized through precipitation or binding with metals (e.g., Fe, Mg), reducing the fraction that remains soluble and directly available for uptake. Together, variable mineralization and partial re-immobilization reduce the controllability of P relative to N, which can cause differences in N:P supply ratios and amplify seasonal supply-demand mismatches. In the present model, these processes are captured by a lumped mineralization coefficient and are not resolved individually. Disentangling the contributions of precipitation, microbial immobilization, and incomplete hydrolysis would require coupling biokinetic and geochemical speciation models, which remains an important direction for improving nutrient recovery predictions.
      - paragraph [ref=e615]: To address such imbalances, strategies such as desalination or buffer tanks have been proposed to concentrate nutrients or temporarily store and release them between low- and high-demand periods. Our optimization results and perturbation analysis suggest that such strategies can be omitted by adding an external mineralizable organic co-substrate to the digesters. When combined with an HPS sized beyond the internal waste-derived supply capacity, additional crop uptake helps consume nutrients during low-demand periods (reducing accumulation risk), while co-digestion supplies limiting nutrients during peak-demand periods.
      - paragraph [ref=e616]: "In the manure-extended networks for Cairo and Amsterdam, co-digestion with livestock manure provided this additional flexibility and enabled closure of both N and P loops when combined with nutrient-rich RAS water. We considered three representative livestock manures with contrasting N:P ratios: chicken (3:1), pig (2.4:1), and cow (4.5:1). The optimizer selected predominantly pig manure in Cairo (85% of total input), whereas chicken manure was preferred in Amsterdam (71%). This difference originates from choosing an HPS area that matches the internal waste-derived nutrient supply during winter (or lowest evapotranspiration period). Subsequently, the optimal design in Amsterdam will require a larger HPS:RAS ratio compared to Cairo and is therefore more prone to nutrient deficits during summer (or highest evapotranspiration period). Under these conditions, the preferred co-substrate is the one that supplies sufficient mineralizable nutrients while keeping the N:P balance close to crop demand, which depends on both the N:P ratio and the amount of N and P supplied per unit of input under the evaluated bounds. This explains why chicken manure was favored over cattle manure in Amsterdam: despite cattle manure’s higher N:P ratio, it contributes less P relative to the required seasonal balance, so using it to cover peak-demand deficits would push the system toward N surplus. In Cairo, the required oversizing is smaller and P remains the dominant limiting nutrient, favoring a more P-targeted co-substrate such as pig manure. Overall, these results show that co-digestion is not only a way to address the mismatch between waste-derived nutrient supply and crop demand, but also a route to reduce external virgin inputs and nutrient-rich water losses under seasonal climates."
      - paragraph [ref=e617]: The perturbation analysis further shows how co-digestion can improve robustness against parameter uncertainty propagation between coupled systems. In the internal-waste-only baseline, under tropical conditions KPI sensitivity is mainly driven by evapotranspiration (demand) and FCR (supply). As seasonality increases, the feasible operating window narrows and parameters that cause negligible changes under tropical conditions can become influential. In the temperate case, for example, perturbations in fish excretion partitioning were sufficient to push N or P trajectories toward water-quality bounds, occasionally triggering discharge or external supplementation to remain feasible. Introducing manure adds an extra control layer that is tunable in flow, and to a certain extent in composition, and allows the optimizer to compensate for temporary shifts in under- and oversupply while keeping state constraints satisfied. In the manure-extended cases, this additional adjustable input was able to suppress KPI sensitivity (ΔWUE/ΔPSS ≈0 under ±20% perturbations) and therefore also reduced uncertainty propagation through the coupled mass balances. The errors originating in one system (e.g., mineralization coefficient, evapotranspiration) can subsequently be absorbed before cascading into downstream states and decisions. However, this improved robustness comes at the expense of additional capacity requirements (higher digester volume throughputs and larger HPS sizing relative to RAS).
      - paragraph [ref=e618]:
        - text: "To quantify how the additional flexibility of anaerobic digestion improves the network performance we compared it with optimized decoupled aquaponics networks (RAS-HPS). Across the three climate cases, integrating anaerobic digestion reduced nutrient losses substantially relative to optimized decoupled aquaponics (DAP). Wasted N decreased by around 46% on average (range: 32%–59%) and wasted P decreased by 35% on average (range: 18%–46%). In the best-performing integrated aqua-agriculture configurations, synthetic P inputs were eliminated and discharge was avoided, saving roughly 18–30 gP m"
