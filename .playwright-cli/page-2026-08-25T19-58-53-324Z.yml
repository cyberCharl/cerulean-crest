    - generic [ref=e84]:
      - heading "Summary" [level=3] [ref=e85]
      - paragraph [ref=e86]: In integrated aqua-agriculture, matching waste-derived nutrient supply with crop demand while maintaining optimal fish and crop conditions remains challenging. We formulate a closed-loop aquaculture-hydroponics network with anaerobic digestion as a constrained optimal-control problem and combine static sizing with climate-driven dynamic flow optimization for contrasting climates. Under weak seasonality (Jakarta), internal wastes (aquaculture water, fish sludge, and plant residues) support discharge-free operation with water, nitrogen, and phosphorus use-efficiencies of 100%, 79%, and 72%. As seasonality increases (Cairo, Amsterdam), feasibility and robustness decline due to shifting demand and limited phosphorus recoverability. Using manure as co-digestion substrate restores closed-cycle operation without synthetic fertilizers. The optimizer prefers pig manure in Cairo and chicken manure in Amsterdam, reflecting climate-specific N:P deficits. Relative to climate-matched decoupled aquaponics, optimized integrated networks cut water, nitrogen, and phosphorus waste by 86%, 46%, and 35%. Overall, the framework enables climate-robust design of circular aqua-agriculture networks, reducing resource use and pollution.
    - generic [ref=e87]:
      - heading "Highlights" [level=3] [ref=e88]
      - list [ref=e89]:
        - listitem [ref=e90]: Integrating anaerobic digestion enables circular industrial aqua-agriculture.
        - listitem [ref=e91]: Internal waste allows discharge- and fertilizer-free operation in tropical climates.
        - listitem [ref=e92]: Increasing seasonality reduces both water and phosphorus loop closure.
        - listitem [ref=e93]: Co-digestion restores loop closure with a climate-dependent optimal manure type.
      - paragraph
    - generic [ref=e94]:
      - heading "Introduction" [level=3] [ref=e95]
      - paragraph [ref=e96]: Over the last few decades, global food production has expanded rapidly, placing increasing pressure on natural resources. Fresh water, arable land, and essential mineral nutrients such as nitrogen and phosphorus are already being used beyond safe planetary limits, threatening ecosystem integrity, the sustainable availability of renewable freshwater resources, and finite phosphate-rock reserves. Improving self-sufficiency and use-efficiency by replacing virgin inputs with resources recovered from waste streams is one way to more sustainably meet future food demand. In this context, integrated aqua-agriculture offers a promising pathway toward closed-resource-cycle food production by growing crops using the metabolic waste products of fish or other aquatic animals as nutrient sources.
      - paragraph [ref=e97]: Aquaculture is the fastest-growing segment of the global food industry and has recently surpassed capture fisheries in seafood production for human consumption. This shift can be attributed to the limitations and decline of wild fisheries stocks, as well as technological advancements that have enhanced aquaculture productivity. As the industry grows, an increasing amount of nutrient-rich waste is produced, particularly nitrogen and phosphorus. Fish retain only about half of the nitrogen and phosphorus supplied in feed, with the remainder released to the culture water as dissolved and particulate waste through gill excretion of ammonia, urine and feces, and feed leftovers. Nitrogen-containing compounds, such as proteins, are catabolized, releasing toxic ammonia, which in recirculating aquaculture systems (RAS) is controlled by biological nitrification in biofilters. However, once nitrate concentrations surpass tolerable limits, part of the water is often discharged without sufficient treatment.
      - paragraph [ref=e98]: Integrating RAS with protected hydroponic systems (i.e., soil-less crop production) can substantially improve water and nitrogen use-efficiency by reusing nutrient-rich aquaculture water for crop production. In contrast to nitrogen, aquaculture water typically contains only small amounts of dissolved phosphorus because inorganic phosphates excreted by fish bind to feed particles and fecal matter, which are removed through mechanical filtration as concentrated sludge. Anaerobic digesters can convert this sludge into an organic fertilizer containing plant-available mineral forms such as phosphates and ammonium. In addition to fish sludge, anaerobic digestion can treat and recycle nitrogen and phosphorus from other organic farm wastes, thereby contributing to the nitrogen and phosphorus recovery that is possible within an industrial aqua-agriculture network. Integrating anaerobic digestion can simultaneously prevent aquaculture from releasing nutrients into the environment and reduce reliance on synthetic fertilizers for plant production.
      - paragraph [ref=e99]: While anaerobic digestion offers many advantages, its integration also increases the level of complexity. A key challenge is to identify system dimensions and corresponding flows that match waste-derived nutrient supply to crop nutrient demand without synthetic fertilizers or allowing nutrients to vary between tolerable levels in both fish or crops components. This is particularly challenging in regions with seasonal climates, given that crop nutrient uptake is largely driven by the climate-dependent crop transpiration rate. As transpiration rates drop from summer to winter, a larger plant cultivation area is needed to balance nitrogen and phosphorus inputs from aquaculture and subsequent sludge digestion. A recent optimization study demonstrated that this supply-demand mismatch in integrated aqua-agriculture can be managed by adopting a staggered production strategy and sizing the protected cultivation area to meet winter requirements, supplemented by an external mineralizable organic source. For example, manure can be diluted to mitigate ammonia toxicity and co-digested to boost nutrient availability during periods of high demand, while staggered fish and crop production helps smooth feed inputs and crop transpiration rates. However, this specific strategy has so far only been investigated in steady-state scenarios in the Netherlands and remains untested under dynamic conditions across contrasting climates.
      - paragraph [ref=e100]: The aim of this model-based study was to quantify under what climatic conditions industrial aqua-agriculture networks can operate in closed water and nutrient cycles, i.e., reusing aquaculture water for irrigation without synthetic fertilizer addition, under realistic daily weather variability, and how this feasibility changes with increasing seasonality. We represent the network with coupled sub-models for water and nutrient dynamics in a RAS producing Nile Tilapia, a hydroponic production system (HPS) growing lettuce, and two anaerobic digesters that separately treat fish sludge and crop residues. Using these models, we applied combined static and dynamic optimization to determine location-specific optimal designs and time-varying flows that minimize discharge and synthetic fertilizer inputs while maintaining fish- and crop water-quality constraints.
      - paragraph [ref=e101]: We evaluated the framework for three contrasting climates using historical weather data. We started with Jakarta, Indonesia, which has a relatively stable tropical climate. The Indonesian aquaculture sector has expanded rapidly in recent decades, and Jakarta is one of the most populous and climate-vulnerable cities globally. We then considered Cairo, Egypt, with a two-seasonal, arid climate characterized by very hot summers and mild winters. Egypt is the largest aquaculture producer in Africa but already relies on water beyond its internal renewable sources, making it increasingly prone to future water stress. Finally, to explore the potential of sustainable integrated aqua-agriculture in strong temperate climates, we selected the Netherlands, where the highly variable four-season climate in Amsterdam makes it the most challenging of the three case studies. For each location, we first assessed a baseline configuration relying only on internal waste streams (aquaculture water, fish sludge, and plant residues). Where internal recycling proved constrained, we analyzed an extended configuration with manure co-digestion and quantified when it restores operational flexibility, including which manure type (chicken, pig, or cattle) is preferred under different seasonal demand profiles. We also benchmarked each location’s best-performing integrated configuration against an optimized decoupled aquaponics (DAP) reference network (RAS-HPS without anaerobic digestion) under identical system boundaries. To the best of our knowledge, no model study has been conducted that explores closure of nutrient and water cycles in integrated aqua-agriculture networks across different climates under dynamic conditions.
      - paragraph [ref=e102]: Figure 1 shows an overview of each submodel used to describe the different set-ups explored in this study. Analyzing these set-ups with a year-scale optimal-control formulation, we show that the internal-waste baseline can maintain fish- and crop water-quality constraints under weak seasonality (Jakarta), becomes marginally phosphorus-limited under moderate seasonality (Cairo), and under strong seasonality (Amsterdam) requires discharge and/or external supplementation to remain feasible. A ±20% parameter perturbation analysis further shows that performance as measured by the key performance indicators (water/nutrient use-efficiency and nutrient self-sufficiency) is largely insensitive to parameter perturbations in Jakarta, whereas in Cairo and Amsterdam manure co-digestion restores N and P balance and increases robustness by providing an additional lever over the N:P supply ratio. Finally, benchmarking against optimized decoupled aquaponics confirms that integrating anaerobic digestion reduces water and nutrient losses and lowers virgin input requirements.
