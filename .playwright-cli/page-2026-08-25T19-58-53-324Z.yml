    - heading "Climate dependent feasibility of closing water and nutrient cycles in industrial aqua-agriculture" [level=2] [ref=e68]
    - paragraph [ref=e70]: Item 4 · Read First
    - paragraph [ref=e72]: Milan de Korte, Joris Bergman, L. Gerard van Willigenburg, Victor Lobanov, Alyssa Joyce, Xiaodong Cheng & Karel J. Keesman — iScience — 8 Jun 2026
    - paragraph [ref=e74]: 13 min for abstract, figures, introduction/conclusion and selected methods · peer-reviewed research; constrained optimal-control modelling study
    - paragraph [ref=e75]: Editor’s margin. The paper models tilapia, hydroponic lettuce and anaerobic digestion as one optimised system. Climate seasonality makes water and nutrient matching harder, particularly for phosphorus; manure co-digestion helps in the model. This is a design study, not a commercial field demonstration.
