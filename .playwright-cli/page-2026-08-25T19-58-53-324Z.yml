    - paragraph [ref=e13]: 14 min · original practitioner essay
    - paragraph [ref=e14]: "Editor’s margin. A practical bridge from prototype to repeatable production, covering tolerances, yield and testability. The key idea: every manufactured product also needs a reliable way to test it."
    - paragraph [ref=e16]: A prototype proves that a design can work. Manufacturing asks whether normal variation still lets it work repeatedly, economically and without heroic intervention.
    - paragraph [ref=e17]: Huang’s central concern is yield. Component tolerances, voltage margins, PCB and mechanical variation, and cosmetic defects create combinations that a bench build may never reveal. A design that is sensitive to those combinations converts apparently cheap components into rework, scrap and late invoices. Spending more on a robust circuit can therefore lower the cost of each saleable unit.
    - paragraph [ref=e18]: "The companion idea is testability. Every physical product implies a second product: the factory test system. Good test fixtures cover every user-facing feature, minimise setup, automate a linear pass/fail flow, record results against serial numbers and remain easy to update. Production testing checks assembly; validation asks whether the design survives its intended life. Confusing the two either misses faults or makes every unit carry an unnecessarily expensive test."
